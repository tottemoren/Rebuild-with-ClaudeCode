<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebuild デザイン案比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one viewer pane (scaled 1440px mockup) + a candidate rail grouped by direction A/B/C */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #1c1f24;
  --muted: #5d6470;
  --line: #dde1e7;
  --accent: #2753d8;
  --accent-soft: #e6ecfc;
  --font: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171b; --surface: #1e2126; --fg: #e9ebef; --muted: #9aa1ac; --line: #343841; --accent: #8aa6ff; --accent-soft: #263257; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #15171b; --surface: #1e2126; --fg: #e9ebef; --muted: #9aa1ac; --line: #343841; --accent: #8aa6ff; --accent-soft: #263257; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; margin: 0 }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; margin-bottom: 20px }
h1 { font-size: 1.5rem; margin: 0; text-wrap: balance }
.lede { color: var(--muted); margin: 0; max-width: 70ch }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) } }

.rail { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
@media (max-width: 900px) { .rail { position: static } }
.group h2 { font-size: .95rem; margin: 0 0 2px }
.group p { font-size: .8rem; color: var(--muted); margin: 0 0 8px }
.cands { display: grid; gap: 6px }
.cand { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--fg);
  font: inherit; cursor: pointer }
.cand:hover { border-color: var(--accent) }
.cand[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft) }
.cand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.cand b { font-size: 1rem; font-variant-numeric: tabular-nums }
.cand span { font-size: .82rem; line-height: 1.4; min-width: 0 }
.cand small { display: block; color: var(--muted); font-size: .74rem }

.viewer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0 }
.vbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line) }
.vbar strong { font-size: 1rem }
.vbar a { color: var(--accent); font-size: .85rem }
.frame-box { position: relative; width: 100%; overflow: hidden; background: #fff }
.frame-box iframe { position: absolute; top: 0; left: 0; width: 1440px; border: 0; transform-origin: 0 0 }
.note { color: var(--muted); font-size: .8rem; margin-top: 12px }
</style>

<div class="wrap">
  <header class="top">
    <h1>Rebuild デザイン案比較</h1>
    <p class="lede">3方向 × 3案 = 9案。どれもホーム画面（メモ表示）とデザインシートです。左の一覧から選ぶと右に表示されます。</p>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="デザイン案一覧"></nav>
    <section class="viewer" aria-live="polite">
      <div class="vbar"><strong id="vtitle"></strong><a id="vopen" href="#" target="_blank" rel="noopener">別タブで原寸表示</a></div>
      <div class="frame-box" id="box"><iframe id="frame" title="デザイン案プレビュー"></iframe></div>
    </section>
  </div>
  <p class="note">モックアップは幅1440pxで作成し、表示枠に合わせて縮小しています。フォントはすべて Google Fonts で配信されている実在のものです。</p>
</div>

<script>
const GROUPS = [
  { id: "A", name: "A｜ニュートラル・メディア型", desc: "YouTube / Google系。白とグレーで画面の枠を目立たせず、メモを主役にする", items: [
    { id: "A1", name: "ホワイト・キャンバス", font: "Zen Kaku Gothic New ＋ Manrope／藍 #2741B8・ピル型" }, { id: "A2", name: "クールグレー・ワークベンチ", font: "IBM Plex Sans JP ＋ Plex Condensed／ティール #0B7064・角丸6px" }, { id: "A3", name: "ウォーム・アーカイブ", font: "Murecho ＋ Bricolage Grotesque／葡萄 #74306E・下線タブ" } ] },
  { id: "B", name: "B｜原稿・制作道具型", desc: "原稿用紙・インク・トーン・ネームの青鉛筆から語彙を借りた、明るい制作ツール", items: [
    { id: "B1", name: "ネーム帳", font: "Zen Kaku Gothic New ＋ Klee One／ネーム水色 #1767BE・墨影ボタン" }, { id: "B2", name: "入稿前の赤ペン", font: "Murecho ＋ Shippori Mincho B1／赤ペン #C42A22・トンボ付きカード" }, { id: "B3", name: "コマ割り定規", font: "BIZ UDPGothic ＋ Zen Old Mincho／製図藍 #3236A3・斜めボタン" } ] },
  { id: "C", name: "C｜カラフル・アセット整理型", desc: "メモ・ストーリー・漫画を色で見分けられる、親しみやすいワークスペース", items: [
    { id: "C1", name: "ふせんボード", font: "Zen Maru Gothic ＋ Mochiy Pop One／パステル付箋・ピル型" }, { id: "C2", name: "カラーインデックス", font: "LINE Seed JP ＋ Outfit／山吹・青・紅・キーキャップ型" }, { id: "C3", name: "若葉トーン", font: "M PLUS Rounded 1c ＋ Kiwi Maru／緑の濃淡7段階・葉っぱ形" } ] },
];
const rail = document.getElementById("rail");
const frame = document.getElementById("frame");
const box = document.getElementById("box");
const buttons = [];
GROUPS.forEach(g => {
  const sec = document.createElement("div");
  sec.className = "group";
  sec.innerHTML = `<h2>${g.name}</h2><p>${g.desc}</p>`;
  const list = document.createElement("div");
  list.className = "cands";
  g.items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "cand"; b.id = "cand-" + it.id;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<b>${it.id}</b><span>${it.name}<small>${it.font}</small></span>`;
    b.addEventListener("click", () => show(it));
    list.appendChild(b); buttons.push([it.id, b]);
  });
  sec.appendChild(list); rail.appendChild(sec);
});
function fit() {
  const s = box.clientWidth / 1440;
  frame.style.transform = `scale(${s})`;
  let h = 1500;
  try { h = frame.contentDocument.documentElement.scrollHeight || h } catch (e) {}
  frame.style.height = h + "px";
  box.style.height = Math.ceil(h * s) + "px";
}
function show(it) {
  frame.src = `designs/${it.id}.html`;
  document.getElementById("vtitle").textContent = `${it.id}　${it.name}`;
  document.getElementById("vopen").href = `designs/${it.id}.html`;
  buttons.forEach(([id, b]) => b.setAttribute("aria-pressed", String(id === it.id)));
  try { localStorage.setItem("rebuild-design-pick", it.id) } catch (e) {}
}
frame.addEventListener("load", () => { fit(); setTimeout(fit, 800) });
window.addEventListener("resize", fit);
let start = "A1";
try { start = localStorage.getItem("rebuild-design-pick") || start } catch (e) {}
const first = GROUPS.flatMap(g => g.items).find(i => i.id === start) || GROUPS[0].items[0];
show(first);
const hash = location.hash.slice(1);
if (hash) { const h = GROUPS.flatMap(g => g.items).find(i => i.id === hash); if (h) show(h) }
</script>

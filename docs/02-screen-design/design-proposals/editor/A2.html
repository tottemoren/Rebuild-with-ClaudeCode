<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebuild 漫画作成 — A2 クールグレー・ワークベンチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style id="layout">
/* ===== LAYOUT (shared by every theme — DO NOT EDIT) =====
   Sizes and positions below are fixed so that all themes keep identical placement. */
*, *::before, *::after { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body { min-width: 1280px }
button { font: inherit; cursor: pointer }
.app { display: grid; grid-template-rows: 132px minmax(0, 1fr); height: 100vh; min-height: 820px }

.hd { display: grid; grid-template-columns: 196px 440px minmax(0, 1fr) auto; gap: 16px; align-items: stretch; padding: 12px 16px }
.hd-brand { display: flex; flex-direction: column; justify-content: center; gap: 10px }
.logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none }
.logo svg { width: 28px; height: 28px; flex: none }
.sb-toggle { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 6px 10px }
.sb-toggle svg { width: 16px; height: 16px }

.story { display: grid; grid-template-rows: auto 1fr auto; gap: 2px; padding: 8px 14px; min-width: 0; overflow: hidden }
.story-title { margin: 0; font-size: 15px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.story-synopsis { margin: 0; font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.story-genres { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap }
.genre-label { white-space: nowrap }
.genre { padding: 1px 8px; white-space: nowrap }

.folders { display: grid; grid-template-rows: minmax(0, 1fr) 6px; gap: 6px; min-width: 0 }
.folder-list { display: flex; gap: 10px; overflow: hidden; margin: 0; padding: 0; list-style: none }
.folder { flex: none; width: 92px; display: grid; grid-template-rows: 1fr auto; gap: 4px; padding: 4px; text-align: left }
.folder-cover { display: block; width: 100%; height: 100%; min-height: 0; overflow: hidden }
.folder-cover svg { display: block; width: 100%; height: 100% }
.folder-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block }
.folder-add { flex: none; width: 64px; display: grid; place-items: center; align-content: center; gap: 4px }
.folder-add svg { width: 20px; height: 20px }
.folder-track { position: relative; overflow: hidden }
.folder-thumb { position: absolute; top: 0; bottom: 0; left: 18%; width: 38% }

.hd-actions { display: flex; align-items: flex-start; gap: 8px; padding-top: 4px }
.hd-actions .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px }
.hd-actions svg { width: 16px; height: 16px }
.avatar { width: 36px; height: 36px; display: grid; place-items: center; padding: 0 }

.body { display: grid; grid-template-columns: 168px minmax(0, 1fr) 280px; min-height: 0 }

.pages { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0 }
.pane-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; gap: 8px }
.pane-head h2 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.count { white-space: nowrap }
.page-list { list-style: none; margin: 0; padding: 4px 12px 12px; overflow: auto; display: grid; gap: 10px; align-content: start }
.page { display: grid; grid-template-columns: 30px 1fr; gap: 6px; align-items: start; width: 100%; padding: 6px; text-align: left }
.page-no { text-align: right; padding-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums }
.page-thumb { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; aspect-ratio: 182 / 128; padding: 3px }
.page-thumb i { display: block }
.page-add { margin: 0 12px 12px; display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 8px }
.page-add svg { width: 16px; height: 16px }

.stage { display: grid; grid-template-rows: minmax(0, 1fr) 56px; min-width: 0; min-height: 0 }
.workspace { position: relative; display: grid; place-items: center; overflow: hidden; padding: 28px 28px 52px }
.spread { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2%; height: min(100%, 640px); aspect-ratio: 368 / 257; max-width: 100% }
.paper { position: relative; padding: 5.5% 6.5%; display: grid }
.koma-grid { display: grid; gap: 3.2% 4%; height: 100% }
.p-right .koma-grid { grid-template-columns: 1.1fr 1fr; grid-template-rows: 1.15fr 1fr 1.3fr }
.p-right .k1 { grid-column: 1 / 3 }
.p-right .k4 { grid-column: 1 / 3 }
.p-left .koma-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1.6fr 1fr }
.p-left .k3 { grid-row: 2; grid-column: 1 / 3 }
.p-left .k4 { grid-column: 1 / 3 }
.koma { position: relative; overflow: hidden }
.koma svg { position: absolute; inset: 0; width: 100%; height: 100% }
.koma.is-selected { z-index: 1 }
.koma-handle { position: absolute; width: 8px; height: 8px; display: none }
.koma.is-selected .koma-handle { display: block }
.h-tl { top: 0; left: 0 } .h-tr { top: 0; right: 0 } .h-bl { bottom: 0; left: 0 } .h-br { bottom: 0; right: 0 }
.page-label { position: absolute; bottom: 1.2%; font-size: 10px; left: 0; right: 0; text-align: center }
.drop-hint { margin: 0; position: absolute; left: 50%; bottom: 12px; font-size: 12px; transform: translateX(-50%); padding: 6px 12px; white-space: nowrap }

.toolbar { display: flex; align-items: center; gap: 8px; padding: 0 16px }
.toolbar .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px }
.toolbar svg { width: 16px; height: 16px }
.zoom { display: inline-flex; align-items: center; gap: 2px; padding: 2px }
.zoom .btn { padding: 5px 8px }
.zoom output { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums }
.toolbar .spacer { flex: 1 }
.save-state { display: inline-flex; align-items: center; gap: 6px }
.save-state svg { width: 14px; height: 14px }

.materials { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0 }
.mat-filter { display: flex; gap: 6px; padding: 0 12px 10px }
.mat-filter .chip { padding: 4px 10px }
.mat-list { overflow: auto; padding: 0 12px 16px; columns: 2; column-gap: 10px }
.mat { break-inside: avoid; margin: 0 0 10px; display: block; width: 100%; padding: 0; position: relative }
.mat svg { display: block; width: 100% }
.mat-name { display: block; font-size: 12px; padding: 4px 6px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 232px; padding: 20px 14px; display: grid; align-content: start; gap: 6px; z-index: 20 }
.sidebar[hidden] { display: none !important }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; text-decoration: none }
.sidebar svg { width: 18px; height: 18px }
.scrim { position: fixed; inset: 0; z-index: 10 }
.scrim[hidden] { display: none !important }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
</style>
<style id="theme">
/* name: クールグレー・ワークベンチ */
/* fonts: https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap */

/* A2 — cool-gray bench, white sheets, deep teal, squared 6px tools (same tokens as Home A2).
   Workspace = Slate #4A545E: a darkened version of the blue-gray bench, so the "desk"
   under the spread is literally the same material as the app background, just deeper. */
:root{
  --bench:#F2F4F6; --sheet:#FFFFFF; --steel:#E8ECF0; --steel-2:#DDE2E7; --rule:#DDE2E7; --rule-strong:#BCC4CC;
  --ink:#1B1F24; --body:#353B42; --text-2:#56616C;
  --accent:#0B7064; --accent-hover:#085A50; --accent-soft:#E1F1EE;
  --desk:#4A545E; --manuscript-ink:#111111;
}
body{font-family:"IBM Plex Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bench);font-size:14px;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- buttons (6px, outlined secondary) ---------- */
.btn{border:1px solid var(--rule-strong);border-radius:6px;background:var(--sheet);color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.2;transition:background-color .12s,border-color .12s}
.btn:hover{background:var(--bench);border-color:#9AA4AE}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--steel);border-color:transparent}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}

/* ---------- header (white sheet on the bench) ---------- */
.hd{background:var(--sheet);border-bottom:1px solid var(--rule)}
.logo{color:var(--accent);border-radius:6px}
.logo-text{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--ink)}
.sb-toggle{background:transparent;border-color:transparent;color:var(--text-2);font-size:13px;font-weight:500}
.sb-toggle:hover{background:var(--steel);color:var(--ink);border-color:transparent}
.story{background:var(--bench);border:1px solid var(--rule);border-radius:8px}
.story-title{font-weight:600;color:var(--ink)}
.story-synopsis{color:var(--body)}
.genre-label{font-size:12px;color:var(--text-2);margin-right:2px}
.genre{font-size:12px;font-weight:500;background:var(--sheet);color:var(--body);border:1px solid var(--rule);border-radius:4px}

/* folder tabs: Home toggle language — selected = white sheet, teal text, teal edge */
.folder{border:1px solid transparent;background:transparent;border-radius:6px;color:var(--ink)}
.folder:hover{background:var(--bench)}
.folder-cover{border:1px solid var(--rule-strong);border-radius:4px;background:#fff}
.folder-name{color:var(--text-2);font-size:11.5px!important;text-align:center;font-weight:500}
.folder.is-active{background:var(--sheet);border-color:var(--rule-strong);box-shadow:inset 0 -3px 0 var(--accent)}
.folder.is-active .folder-cover{border-color:var(--ink)}
.folder.is-active .folder-name{color:var(--accent);font-weight:600}
.folder-add{background:transparent;border:1px dashed var(--rule-strong);border-radius:6px;color:var(--text-2);font-size:12px;font-weight:500}
.folder-add:hover{background:var(--bench)}
.folder-track{background:var(--steel);border-radius:2px}
.folder-thumb{background:var(--rule-strong);border-radius:2px}

.avatar{background:var(--ink);border-color:var(--ink);color:#fff;border-radius:50%;font-weight:700}
.avatar:hover{background:#353B42}

/* ---------- page list: Home side-menu language — white + 3px teal left bar ---------- */
.pages{background:var(--bench);border-right:1px solid var(--rule)}
.pane-head h2{font-weight:600;color:var(--ink)}
.count{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:12.5px;color:var(--text-2)}
.page{border:1px solid transparent;background:transparent;border-radius:6px;color:var(--text-2)}
.page:hover{background:var(--steel)}
.page-no{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:12.5px}
.page-thumb{background:var(--steel-2);border-radius:2px}
.page-thumb i{background:#fff;box-shadow:inset 0 0 0 1px var(--rule-strong)}
.page.is-active{background:var(--sheet);border-color:var(--rule);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.page.is-active .page-no{font-weight:700}
.page.is-active .page-thumb{background:var(--accent)}
.page.is-empty .page-thumb i{background:repeating-linear-gradient(-45deg,#fff 0 4px,var(--steel) 4px 8px)}
.page-add{border-style:dashed;background:transparent;color:var(--text-2)}
.page-add:hover{background:var(--steel);color:var(--ink)}

/* ---------- stage ---------- */
.workspace{background:var(--desk)}
.paper{background:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.22)}
.koma{border:2px solid var(--manuscript-ink);background:#fff}
.koma.is-selected{outline:2px solid var(--accent);outline-offset:3px}
.koma-handle{width:9px;height:9px;background:#fff;border:2px solid var(--accent);border-radius:0}
.page-label{color:#6B6B6B;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600}
.drop-hint{background:rgba(27,31,36,.86);color:#FFFFFF;border-radius:6px;font-weight:500}

.toolbar{background:var(--sheet);border-top:1px solid var(--rule)}
.zoom{background:var(--bench);border:1px solid var(--rule);border-radius:6px}
.zoom .btn{border-color:transparent;background:transparent;border-radius:4px}
.zoom .btn:hover{background:var(--steel)}
.zoom output{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:13.5px;color:var(--ink)}
.save-state{font-size:12.5px;color:var(--text-2)}
.save-state svg{color:var(--accent)}

/* ---------- materials ---------- */
.materials{background:var(--bench);border-left:1px solid var(--rule)}
/* chips: Home toggle language — tray of steel, selected = white + teal */
.chip{border:1px solid var(--rule);border-radius:4px;background:var(--steel);color:var(--text-2);font-size:12.5px;font-weight:500}
.chip:hover{color:var(--ink)}
.chip.is-active{background:var(--sheet);color:var(--accent);border-color:var(--accent);font-weight:600}
.mat{border:1px solid var(--rule);background:#fff;border-radius:6px;overflow:hidden}
.mat:hover{border-color:var(--rule-strong)}
.mat svg{border-bottom:1px solid var(--rule)}
.mat-name{color:var(--body)}

/* ---------- slide-in menu ---------- */
.sidebar{background:var(--bench);border-right:1px solid var(--rule);box-shadow:8px 0 24px rgba(27,31,36,.16)}
.sidebar a{border-radius:6px;color:var(--ink);font-size:14px;gap:16px}
.sidebar a svg{color:var(--text-2)}
.sidebar a:hover{background:var(--steel)}
.sidebar a[aria-current]{background:var(--sheet);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent),0 0 0 1px var(--rule)}
.sidebar a[aria-current] svg{color:var(--accent)}
.scrim{background:rgba(27,31,36,.36)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>

    <pattern id="tone" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="#000" opacity=".55"/></pattern>

    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div class="app" id="app">
  <header class="hd">
    <div class="hd-brand">
      <a class="logo" href="#" aria-label="Rebuild ホームへ">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3 15h14M17 3v26M17 20h12" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
        <span class="logo-text">Rebuild</span>
      </a>
      <button class="btn sb-toggle" id="sbToggle" type="button" aria-expanded="false" aria-controls="sidebar">
        <svg aria-hidden="true"><use href="#i-menu"/></svg><span>メニュー</span>
      </button>
    </div>

    <section class="story" aria-label="選択中のストーリー">
      <h1 class="story-title">潮見町の灯台守　第2話「十三回目の鐘」</h1>
      <p class="story-synopsis">町じゅうの時計が5分ずつ遅れる港町。見習い時計修理工の灯（あかり）は、鐘が13回鳴った夜、灯台に住む少年ミナトと出会う。</p>
      <div class="story-genres"><span class="genre-label">ジャンル</span><span class="genre">ファンタジー</span><span class="genre">ヒューマンドラマ</span><span class="genre">ミステリー</span></div>
    </section>

    <nav class="folders" aria-label="素材フォルダ">
      <ul class="folder-list" role="tablist">
        <li><button class="folder is-active" role="tab" aria-selected="true" type="button">
          <span class="folder-cover"><svg viewBox="0 0 84 60" aria-hidden="true"><rect width="84" height="60" fill="#fff"/><rect width="84" height="60" fill="url(#tone-lt)"/><circle cx="34" cy="26" r="11" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M23 24c2-10 20-12 23 0-4-3-8-4-12-1-3-2-7-2-11 1z" fill="#111"/><path d="M18 60c2-14 30-14 32 0" fill="#fff" stroke="#111" stroke-width="1.6"/><ellipse cx="64" cy="20" rx="13" ry="9" fill="#fff" stroke="#111" stroke-width="1.4"/></svg></span>
          <span class="folder-name">灯（あかり）</span></button></li>
        <li><button class="folder" role="tab" aria-selected="false" type="button">
          <span class="folder-cover"><svg viewBox="0 0 84 60" aria-hidden="true"><rect width="84" height="60" fill="#fff"/><circle cx="42" cy="24" r="10" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M31 22c1-9 21-9 22 0l-4-2-3 3-4-4-4 4-3-3z" fill="#111"/><path d="M26 60c1-13 31-13 32 0" fill="url(#hatch)" stroke="#111" stroke-width="1.6"/></svg></span>
          <span class="folder-name">ミナト</span></button></li>
        <li><button class="folder" role="tab" aria-selected="false" type="button">
          <span class="folder-cover"><svg viewBox="0 0 84 60" aria-hidden="true"><rect width="84" height="60" fill="#fff"/><rect y="38" width="84" height="22" fill="url(#tone)"/><path d="M48 60V14l5-8 5 8v46z" fill="#fff" stroke="#111" stroke-width="1.6"/><path d="M53 6v-3M40 12l-8-3M66 12l8-3" stroke="#111" stroke-width="1.4"/><path d="M0 44h84" stroke="#111" stroke-width="1.2"/></svg></span>

services:

  frontend:
    build: ./RebuildReact
    container_name: rebuild-react
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./RebuildJava
    container_name: rebuild-java
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: RebuildDB_CloudCode-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: RebuildDB_CloudCode
      MYSQL_USER: RebuildDB_CloudCode
      MYSQL_PASSWORD: RebuildDB_CloudCode
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql


volumes:
  mysql_data:
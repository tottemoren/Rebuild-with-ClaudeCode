spring.application.name=RebuildJava

spring.datasource.url=jdbc:mysql://mysql:3306/RebuildDB_CloudCode
spring.datasource.username=RebuildDB_CloudCode
spring.datasource.password=RebuildDB_CloudCode

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# プロフィール画像アップロード設定
# アプリの起動ディレクトリ（gradlew bootRun / Eclipseの実行構成の作業ディレクトリ）からの相対パスに保存される
file.upload-dir=uploads/profile-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 登録に必要な招待コード（限定公開の間だけ使う）。公開リポジトリに書かないよう、環境変数 INVITE_CODE で渡す。
# 未設定のときは新規登録を受け付けない。
app.invite-code=${INVITE_CODE:}

# イラスト素材アップロード設定（v1簡易版：ローカルディスク保存。将来的にS3へ移行予定。03-system-design参照）
file.materials-upload-dir=uploads/materials
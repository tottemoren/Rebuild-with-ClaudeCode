name: Frontend CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RebuildReact

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: RebuildReact/package-lock.json

      - name: 依存関係をインストール
        run: npm ci

      - name: Lintを実行
        run: npm run lint

      - name: テストを実行
        run: npm run test
